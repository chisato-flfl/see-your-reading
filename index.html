<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識の地図 v2 - See Your Reading</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(25, 28, 36, 0.7);
            --text-color: #c5c6c7;
            --primary-color: #66fcf1;
            --secondary-color: #45a29e;
            --book-color: #8b5cf6; /* 紫系 */
            --keyword-color: #3b82f6; /* 青系 */
            --highlight-book: #d946ef; /* 強いピンク紫 */
            --highlight-kw: #60a5fa; /* 強い青 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1a1e29 0%, #0b0c10 100%);
            color: var(--text-color);
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            scrollbar-width: thin;
        }

        #ui-container::-webkit-scrollbar {
            width: 6px;
        }
        #ui-container::-webkit-scrollbar-track {
            background: transparent;
        }
        #ui-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        h1 {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        h2 {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 12px;
            font-weight: 600;
        }

        p.desc {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        hr {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 24px 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #ddd;
        }

        input, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(102, 252, 241, 0.3);
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--book-color), var(--keyword-color));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-consult {
            background: linear-gradient(135deg, #d946ef, #60a5fa);
        }
        
        .btn-consult:hover {
            box-shadow: 0 4px 12px rgba(217, 70, 239, 0.4);
        }

        .result-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
        }

        .result-message {
            font-size: 0.9rem;
            color: var(--primary-color);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .result-book {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .result-book:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .result-book-title {
            font-weight: 600;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }
        .result-book-keywords {
            font-size: 0.8rem;
            color: #aaa;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* D3.js グラフのスタイル */
        .node circle {
            stroke: #fff;
            stroke-width: 1.5px;
            transition: all 0.3s ease;
        }

        .node text {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            fill: #fff;
            transition: all 0.3s ease;
        }

        .link {
            stroke: rgba(255, 255, 255, 0.2);
            stroke-opacity: 0.6;
            transition: stroke-opacity 0.3s ease;
        }

        /* 凡例 */
        .legend {
            margin-top: 24px;
            font-size: 0.8rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .legend-book { background-color: var(--book-color); box-shadow: 0 0 8px var(--book-color); }
        .legend-keyword { background-color: var(--keyword-color); box-shadow: 0 0 8px var(--keyword-color); }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>知識の地図 v2</h1>
        <p class="desc">読んだ本とキーワードをつなぎ、<br>思考の広がりを可視化します。</p>

        <!-- モヤモヤ相談機能 (v2 新機能) -->
        <div class="consult-section">
            <h2>💭 モヤモヤ相談</h2>
            <p class="desc" style="margin-bottom: 12px;">今の悩みや考えていることを入力すると、過去の読書知識からヒントを探します。</p>
            <div class="form-group">
                <textarea id="worry-input" placeholder="例: 将来のキャリアについて悩んでいる。自分らしく生きたいが、社会の枠組みに縛られている気がする..."></textarea>
            </div>
            <button id="consult-btn" class="btn-consult">ヒントを探す</button>
            <button id="clear-btn" style="background: rgba(255,255,255,0.1); margin-top: 8px; font-size: 0.9rem; padding: 8px;">クリア</button>
            
            <div id="result-container" class="result-box" style="display: none;">
                <!-- 結果がここに表示される -->
            </div>
        </div>

        <hr>

        <form id="add-form">
            <h2>📚 本の追加</h2>
            <div class="form-group">
                <label for="book-title">本のタイトル (既存の本を選ぶとキーワードを追加)</label>
                <input type="text" id="book-title" list="book-list" placeholder="例: サピエンス全史" required autocomplete="off">
                <datalist id="book-list"></datalist>
            </div>
            <div class="form-group">
                <label for="keywords">キーワード（カンマ区切り）</label>
                <input type="text" id="keywords" placeholder="例: 歴史, 人類, 認知革命" required autocomplete="off">
            </div>
            <button type="submit">本・キーワードを追加</button>
        </form>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color legend-book"></div>
                <span>本 (Book)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color legend-keyword"></div>
                <span>キーワード (Keyword)</span>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // データ構造
        const nodes = [];
        const links = [];

        // v2: 指定された初期データ
        const initialData = [
            { title: "嫌われる勇気", keywords: ["自己理解", "心理学", "哲学"] },
            { title: "LIFE SHIFT", keywords: ["人生", "働き方", "自己理解"] },
            { title: "人新世の資本論", keywords: ["社会", "資本主義", "哲学"] }
        ];

        // グラフ設定
        const container = document.getElementById('canvas-container');
        let width = container.clientWidth;
        let height = container.clientHeight;

        const svg = d3.select("#canvas-container").append("svg")
            .attr("width", width)
            .attr("height", height);

        // コンテナグループ（ズーム/パン用）
        const g = svg.append("g");

        // ズーム機能
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
        svg.call(zoom);

        // シミュレーション設定（ふわふわ動く）
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collide", d3.forceCollide().radius(d => d.radius + 5).iterations(2))
            // 常に微弱な動きを維持するための設定
            .alphaDecay(0.01) 
            .velocityDecay(0.6);

        let linkGroup = g.append("g").attr("class", "links");
        let nodeGroup = g.append("g").attr("class", "nodes");

        // 描画更新関数
        function updateGraph() {
            // リンクの更新
            const linkSelection = linkGroup.selectAll("line").data(links);
            
            const linkEnter = linkSelection.enter().append("line")
                .attr("class", "link")
                .style("stroke-width", d => Math.sqrt(d.value || 1));

            linkSelection.exit().remove();
            const link = linkEnter.merge(linkSelection);
            
            // ハイライト時のリンクの透明度
            link.style("stroke-opacity", d => {
                const anyHighlighted = nodes.some(n => n.isHighlighted);
                if (anyHighlighted) {
                    if (d.source.isHighlighted && d.target.isHighlighted) return 0.9;
                    return 0.1;
                }
                return 0.6;
            })
            .style("stroke", d => {
                const anyHighlighted = nodes.some(n => n.isHighlighted);
                if (anyHighlighted && d.source.isHighlighted && d.target.isHighlighted) return "#fff";
                return "rgba(255, 255, 255, 0.2)";
            });

            // ノードの更新
            const nodeSelection = nodeGroup.selectAll(".node").data(nodes, d => d.id);
            
            const nodeEnter = nodeSelection.enter().append("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            // ノードの円
            nodeEnter.append("circle");

            // ノードのテキスト
            nodeEnter.append("text")
                .attr("dx", 0)
                .attr("text-anchor", "middle");

            nodeSelection.exit().remove();
            const node = nodeEnter.merge(nodeSelection);

            // 円のスタイル更新 (ハイライト状態を反映)
            node.select("circle")
                .attr("r", d => d.isHighlighted ? d.radius * 1.3 : d.radius)
                .attr("fill", d => {
                    if (d.type === "book") return d.isHighlighted ? "var(--highlight-book)" : "var(--book-color)";
                    return d.isHighlighted ? "var(--highlight-kw)" : "var(--keyword-color)";
                })
                .style("filter", d => {
                    if (d.isHighlighted) {
                        return `drop-shadow(0 0 20px ${d.type === "book" ? "var(--highlight-book)" : "var(--highlight-kw)"})`;
                    }
                    return `drop-shadow(0 0 8px ${d.type === "book" ? "rgba(139, 92, 246, 0.6)" : "rgba(59, 130, 246, 0.6)"})`;
                })
                .style("opacity", d => {
                    const anyHighlighted = nodes.some(n => n.isHighlighted);
                    if (anyHighlighted && !d.isHighlighted) return 0.2;
                    return 1;
                });

            // テキストのスタイル更新
            node.select("text")
                .attr("dy", d => (d.isHighlighted ? d.radius * 1.3 : d.radius) + 15)
                .text(d => d.label)
                .style("font-size", d => d.type === "book" ? "14px" : "12px")
                .style("font-weight", d => d.isHighlighted || d.type === "book" ? "600" : "400")
                .style("opacity", d => {
                    const anyHighlighted = nodes.some(n => n.isHighlighted);
                    if (anyHighlighted && !d.isHighlighted) return 0.2;
                    return 1;
                });

            // シミュレーションの更新
            simulation.nodes(nodes).on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            });

            simulation.force("link").links(links);
            simulation.alpha(0.3).restart();
        }

        // ドラッグイベントハンドラ
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0.05);
            d.fx = null;
            d.fy = null;
        }

        // 既存の本のリストを更新する関数
        function updateBookList() {
            const dataList = document.getElementById('book-list');
            dataList.innerHTML = '';
            nodes.filter(n => n.type === 'book').forEach(book => {
                const option = document.createElement('option');
                option.value = book.label;
                dataList.appendChild(option);
            });
        }

        // データ追加処理
        function addData(title, keywordsStr) {
            const keywords = keywordsStr.split(',').map(k => k.trim()).filter(k => k !== "");
            
            if (keywords.length === 0) return;

            // 本ノードの追加または取得
            let bookNode = nodes.find(n => n.id === "book-" + title);
            if (!bookNode) {
                bookNode = { 
                    id: "book-" + title, 
                    label: title, 
                    type: "book", 
                    radius: 20,
                    x: width / 2 + (Math.random() - 0.5) * 100,
                    y: height / 2 + (Math.random() - 0.5) * 100,
                    keywords: [],
                    isHighlighted: false
                };
                nodes.push(bookNode);
                updateBookList(); // 本のリストを更新
            }

            keywords.forEach(kw => {
                if (!bookNode.keywords.includes(kw)) {
                    bookNode.keywords.push(kw);
                }

                // キーワードノードの追加または取得
                let kwNode = nodes.find(n => n.id === "kw-" + kw);
                if (!kwNode) {
                    kwNode = { 
                        id: "kw-" + kw, 
                        label: kw, 
                        type: "keyword", 
                        radius: 12,
                        x: width / 2 + (Math.random() - 0.5) * 100,
                        y: height / 2 + (Math.random() - 0.5) * 100,
                        isHighlighted: false
                    };
                    nodes.push(kwNode);
                }

                // リンクの追加
                const linkExists = links.find(l => 
                    (l.source.id === bookNode.id && l.target.id === kwNode.id) ||
                    (l.source === bookNode.id && l.target === kwNode.id)
                );
                
                if (!linkExists) {
                    links.push({ source: bookNode.id, target: kwNode.id, value: 1 });
                }
            });

            updateGraph();
        }

        // フォーム送信イベント (本の追加)
        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('book-title');
            const keywordsInput = document.getElementById('keywords');
            
            addData(titleInput.value, keywordsInput.value);
            
            titleInput.value = '';
            keywordsInput.value = '';
            titleInput.focus();
        });

        // モヤモヤ相談の実行
        document.getElementById('consult-btn').addEventListener('click', () => {
            const worryText = document.getElementById('worry-input').value;
            const resultContainer = document.getElementById('result-container');
            
            if (!worryText.trim()) {
                clearHighlights();
                return;
            }

            let matchedBooks = [];
            
            // 本のキーワードと悩みを照合
            nodes.filter(n => n.type === 'book').forEach(book => {
                let matchCount = 0;
                let matchedKeywords = [];
                
                book.keywords.forEach(kw => {
                    // 単純な部分一致
                    if (worryText.includes(kw)) {
                        matchCount++;
                        matchedKeywords.push(kw);
                    }
                });
                
                book.isHighlighted = matchCount > 0;
                if (matchCount > 0) {
                    matchedBooks.push({ title: book.label, keywords: matchedKeywords });
                }
            });

            // キーワードノードもハイライト
            nodes.filter(n => n.type === 'keyword').forEach(kwNode => {
                kwNode.isHighlighted = worryText.includes(kwNode.label);
            });

            updateGraph();

            // 結果UIの表示
            if (matchedBooks.length > 0) {
                let html = '<div class="result-message">✨ この本がヒントになるかもしれません</div>';
                matchedBooks.forEach(b => {
                    html += `
                        <div class="result-book">
                            <div class="result-book-title">📘 ${b.title}</div>
                            <div class="result-book-keywords">関連キーワード: ${b.keywords.join(', ')}</div>
                        </div>
                    `;
                });
                resultContainer.innerHTML = html;
                resultContainer.style.display = 'block';
            } else {
                resultContainer.innerHTML = '<div class="result-message" style="color:#aaa;">直接関連する本は見つかりませんでしたが、新しい本を追加してみましょう。</div>';
                resultContainer.style.display = 'block';
            }
        });

        // クリアボタン
        document.getElementById('clear-btn').addEventListener('click', () => {
            document.getElementById('worry-input').value = '';
            clearHighlights();
        });

        function clearHighlights() {
            nodes.forEach(n => n.isHighlighted = false);
            updateGraph();
            document.getElementById('result-container').style.display = 'none';
        }

        // ウィンドウリサイズ対応
        window.addEventListener('resize', () => {
            width = container.clientWidth;
            height = container.clientHeight;
            svg.attr("width", width).attr("height", height);
            simulation.force("center", d3.forceCenter(width / 2, height / 2));
            simulation.alpha(0.3).restart();
        });

        // 初期データの読み込み
        initialData.forEach(data => {
            addData(data.title, data.keywords.join(', '));
        });

        // ふわふわ感を強調するための定期的な微力追加
        setInterval(() => {
            nodes.forEach(node => {
                node.vx += (Math.random() - 0.5) * 0.5;
                node.vy += (Math.random() - 0.5) * 0.5;
            });
            simulation.alpha(0.1).restart();
        }, 3000);

    </script>
</body>
</html>
