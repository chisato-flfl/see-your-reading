<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識宇宙 Knowledge Cosmos - See Your Reading</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020205;
            --panel-bg: rgba(10, 12, 20, 0.75);
            --text-color: #e2e8f0;
            --primary-color: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.5);
            --panel-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 15px rgba(56, 189, 248, 0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        h1 {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 6px;
            font-weight: 600;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        h2 {
            font-size: 1.05rem;
            color: #fff;
            margin-bottom: 12px;
            font-weight: 600;
        }

        p.desc {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        hr {
            border: none;
            border-top: 1px solid var(--panel-border);
            margin: 24px 0;
        }

        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }
        input:focus, textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-glow);
            background: rgba(0, 0, 0, 0.6);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.8), rgba(56, 189, 248, 0.8));
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
            background: linear-gradient(135deg, rgba(139, 92, 246, 1), rgba(56, 189, 248, 1));
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #view-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
            color: #aaa;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }
    </style>

    <!-- Import Map: WebGPU依存を含まない通常のThree.jsを指定 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "d3-force-3d": "https://esm.sh/d3-force-3d@3.0.5?external=three"
        }
    }
    </script>
</head>
<body>
    <div id="ui-container">
        <h1>Knowledge Cosmos</h1>
        <p class="desc">あなたの読書記録が星となり、<br>広大な知識の宇宙を形成します。</p>

        <form id="add-form">
            <h2>知識の種を追加</h2>
            <div class="form-group">
                <label for="book-title">本のタイトル</label>
                <input type="text" id="book-title" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="keywords">キーワード（カンマ区切り）</label>
                <input type="text" id="keywords" required autocomplete="off">
            </div>
            <button type="submit">宇宙へ放つ</button>
        </form>
    </div>

    <div id="view-controls">ドラッグで視点移動 / スクロールでズーム</div>
    <div id="canvas-container"></div>

    <script type="module">
        // 外部ライブラリをラップせず、初心者に優しい「通常のThree.js」構成で実装
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { forceSimulation, forceLink, forceManyBody, forceCenter } from 'd3-force-3d';

        // --- 1. Three.js の基本セットアップ (WebGLRendererの使用) ---
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 150);

        // 要件: 通常のWebGLRendererを利用（WebGPU依存の排除）
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. データの準備 ---
        const nodesData = [];
        const linksData = [];
        const nodeMeshes = new Map(); // IDからMeshへのマッピング

        // テキストを描画する関数 (CanvasTextureを利用)
        function createTextSprite(text, type) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;
            
            const isRoot = type === 'root';
            const isBook = type === 'book';
            
            ctx.font = isRoot ? "bold 24px sans-serif" : "bold 16px sans-serif";
            ctx.fillStyle = isRoot ? "#fef08a" : (isBook ? "#ffffff" : "#94a3b8");
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0,0,0,1)";
            ctx.shadowBlur = 4;
            ctx.fillText(text, 128, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(24, 6, 1);
            return sprite;
        }

        // ノードをシーンに追加する関数
        function addNodeMesh(node) {
            const isRoot = node.type === 'root';
            const isBook = node.type === 'book';
            
            const radius = isRoot ? 6 : (isBook ? 3 : 1.5);
            const color = isRoot ? 0xfacc15 : (isBook ? 0xc084fc : 0x67e8f9);

            const group = new THREE.Group();

            // 球体モデル
            const geo = new THREE.SphereGeometry(radius, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
            const sphere = new THREE.Mesh(geo, mat);
            group.add(sphere);

            // テキストラベル
            const textSprite = createTextSprite(node.label, node.type);
            textSprite.position.y = -radius - 2.5;
            group.add(textSprite);

            scene.add(group);
            nodeMeshes.set(node.id, group);
        }

        // 初期データ（サンプルノード）
        const sampleData = [
            { title: "サピエンス全史", keywords: ["歴史", "人類", "文明", "社会"] },
            { title: "人新世の資本論", keywords: ["資本主義", "社会", "環境", "哲学"] },
            { title: "LIFE SHIFT", keywords: ["人生", "キャリア", "働き方", "自己理解"] },
            { title: "嫌われる勇気", keywords: ["自己理解", "心理学", "哲学"] }
        ];

        // ルートノードの作成
        const rootNode = { id: 'root', label: 'Knowledge Universe', type: 'root' };
        nodesData.push(rootNode);

        // 本とキーワードを展開してノード化
        sampleData.forEach(book => {
            const bookId = 'book-' + book.title;
            nodesData.push({ id: bookId, label: book.title, type: 'book' });
            linksData.push({ source: 'root', target: bookId }); // ルートと接続

            book.keywords.forEach(kw => {
                const kwId = 'kw-' + kw;
                if (!nodesData.find(n => n.id === kwId)) {
                    nodesData.push({ id: kwId, label: kw, type: 'keyword' });
                }
                linksData.push({ source: bookId, target: kwId });
            });
        });

        // --- 3. D3 3Dフォースシミュレーション ---
        // ノードにランダムな初期位置を付与
        nodesData.forEach(n => {
            n.x = (Math.random() - 0.5) * 50;
            n.y = (Math.random() - 0.5) * 50;
            n.z = (Math.random() - 0.5) * 50;
            addNodeMesh(n); // メッシュの生成
        });

        const simulation = forceSimulation(nodesData)
            .numDimensions(3)
            .force('link', forceLink(linksData).id(d => d.id).distance(20))
            .force('charge', forceManyBody().strength(-80))
            .force('center', forceCenter(0, 0, 0));

        // リンク（線）を描画するためのラインオブジェクト
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
        const lineGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(linksData.length * 6); // 各線分に x,y,z が2つ
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(linesMesh);

        // 背景の星屑パーティクル
        const starGeo = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 1000;
            starPos[i*3+1] = (Math.random() - 0.5) * 1000;
            starPos[i*3+2] = (Math.random() - 0.5) * 1000;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0x888888, size: 1.0, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- 4. アニメーションループ ---
        function animate() {
            requestAnimationFrame(animate);

            // シミュレーション結果をMeshに反映
            nodesData.forEach(node => {
                const group = nodeMeshes.get(node.id);
                if (group) {
                    group.position.set(node.x, node.y, node.z);
                }
            });

            // リンクの線を更新
            const linePositions = linesMesh.geometry.attributes.position.array;
            linksData.forEach((link, i) => {
                // link.source, link.target はD3によってオブジェクト参照に変換されている
                linePositions[i * 6]     = link.source.x;
                linePositions[i * 6 + 1] = link.source.y;
                linePositions[i * 6 + 2] = link.source.z;
                linePositions[i * 6 + 3] = link.target.x;
                linePositions[i * 6 + 4] = link.target.y;
                linePositions[i * 6 + 5] = link.target.z;
            });
            linesMesh.geometry.attributes.position.needsUpdate = true;

            // 星屑のゆっくりとした回転
            stars.rotation.y += 0.0005;

            controls.update();
            renderer.render(scene, camera);
        }
        
        // 描画開始
        animate();

        // ウィンドウリサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
